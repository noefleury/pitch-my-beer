name: tests

on:
  push

jobs:

  tests:

    runs-on: ubuntu-latest

    services:

      docker_sql_tests:
        image: mariadb:12.2.2
        env:
          MYSQL_DATABASE: pitch-my-beer
          MYSQL_ROOT_PASSWORD: root
          MYSQL_TCP_PORT: 3307
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-timeout=2s --health-retries=3
        ports:
          - 3307:3307

    steps:

      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.5
          coverage: xdebug
          tools: composer:v2

      - name: Install dependencies
        run: composer install

      - name: Running tests
        env:
          DB_HOST: 127.0.0.1
        run: ./vendor/bin/phpunit --coverage-clover coverage.xml --log-junit junit.xml

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
